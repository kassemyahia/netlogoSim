name: Deploy React App to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: npm run lint && npm test

      - name: Setup Deno for Edge Function tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test and type-check Edge Functions
        run: |
          deno test supabase/functions/tests
          deno check \
            supabase/functions/project-api/index.ts \
            supabase/functions/google-owner/index.ts \
            supabase/functions/sheets-worker/index.ts \
            supabase/functions/legacy-migration/index.ts

      - name: Build project with Supabase Secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BOOK_G7_MATH_ID: ${{ vars.VITE_BOOK_G7_MATH_ID }}
          VITE_BOOK_G7_SCIENCE_ID: ${{ vars.VITE_BOOK_G7_SCIENCE_ID }}
          VITE_BOOK_G7_PHYSICS_ID: ${{ vars.VITE_BOOK_G7_PHYSICS_ID }}
          VITE_BOOK_G8_ALGEBRA_ID: ${{ vars.VITE_BOOK_G8_ALGEBRA_ID }}
          VITE_BOOK_G8_GEOMETRY_ID: ${{ vars.VITE_BOOK_G8_GEOMETRY_ID }}
          VITE_BOOK_G8_SCIENCE_ID: ${{ vars.VITE_BOOK_G8_SCIENCE_ID }}
          VITE_BOOK_G8_PHYSICS_ID: ${{ vars.VITE_BOOK_G8_PHYSICS_ID }}
          VITE_BOOK_G9_ALGEBRA_ID: ${{ vars.VITE_BOOK_G9_ALGEBRA_ID }}
          VITE_BOOK_G9_GEOMETRY_ID: ${{ vars.VITE_BOOK_G9_GEOMETRY_ID }}
          VITE_BOOK_G9_SCIENCE_ID: ${{ vars.VITE_BOOK_G9_SCIENCE_ID }}
          VITE_BOOK_G9_PHYSICS_ID: ${{ vars.VITE_BOOK_G9_PHYSICS_ID }}
        run: npm run build

      - name: Install browser for responsive checks
        run: npx playwright install --with-deps chromium

      - name: Run responsive browser checks
        run: npm run test:browser

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
